# loopwise + a self-hosted BRouter. `docker compose up -d` on a fresh machine:
#   1. `segments` downloads the BRouter rd5 tiles for SEGMENTS_BBOX (default: France, ~1.5 GB, first run only),
#   2. `brouter` starts once they are there,
#   3. `loopwise` serves the API on http://localhost:${LOOPWISE_PORT:-8000} (OpenAPI docs at /docs).
# Monthly segment refresh (cron), see the wiki page "Self-hosting":
#   0 4 1 * *  cd /path/to/loopwise && docker compose run --rm segments && docker compose restart brouter
name: loopwise

x-loopwise-image: &loopwise-image
  image: ${LOOPWISE_IMAGE:-ghcr.io/constantin-hentgen/loopwise:latest}
  build: .

services:
  loopwise:
    <<: *loopwise-image
    env_file:
      - path: .env
        required: false
    environment:
      BROUTER_URL: ${BROUTER_URL:-http://brouter:17777/brouter}
    ports:
      - "${LOOPWISE_PORT:-8000}:8000"
    depends_on:
      brouter:
        condition: service_started
    restart: unless-stopped

  brouter:
    image: ${BROUTER_IMAGE:-ghcr.io/abrensch/brouter:v1.7.8}
    environment:
      # 4 threads: loopwise sends at most 4 routing calls in parallel. 1 GB heap is enough for 150 km bike loops.
      MAXTHREADS: ${BROUTER_MAXTHREADS:-4}
      JAVA_OPTS: ${BROUTER_JAVA_OPTS:--Xmx1024M -Xms128M -Xmn8M -DmaxRunningTime=60 -DuseRFCMimeType=false -DusePOSTRequests=false}
    volumes:
      - segments:/segments4:ro
      # Custom loopwise profiles are mounted next to BRouter's built-in ones (lookups.dat must stay there), one file
      # per profile, e.g. (milestone 4):
      # - ./profiles/running-deserted.brf:/profiles2/running-deserted.brf:ro
    # Not published on the host: only loopwise talks to it. Uncomment to try BRouter by hand.
    # ports:
    #   - "17777:17777"
    depends_on:
      segments:
        condition: service_completed_successfully
    restart: unless-stopped

  segments:
    <<: *loopwise-image
    # --ok-if-present: if the segment server is briefly down, start with the tiles we already have.
    command: ["loopwise-segments", "--ok-if-present"]
    env_file:
      - path: .env
        required: false
    volumes:
      - segments:/segments4
    restart: "no"

volumes:
  segments:
